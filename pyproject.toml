[project]
name = "llm-regex-docx-anonymizer"
version = "0.1.0"
description = "DOCX anonymization with regex for formal entities and GPT-4.1-mini for contextual entities."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.82.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
